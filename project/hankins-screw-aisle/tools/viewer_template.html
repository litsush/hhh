<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Screw aisle in 3D</title>
<style>
:root{--ink:#16233f;--mute:#5d6880;--paper:#f3f1ea;--line:#d8d4c8}
html,body{margin:0;height:100%;background:#1b1d22;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:12px;top:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
.chip{background:rgba(243,241,234,.94);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px}
.chip a{color:#14389a}
button.chip{cursor:pointer;font:inherit;font-size:14px;color:var(--ink)}
#info{position:fixed;z-index:2;left:12px;bottom:12px;max-width:min(420px,calc(100% - 24px));background:rgba(243,241,234,.96);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:none}
#info h2{margin:0 0 2px;font-size:17px}#info p{margin:0 0 8px;color:var(--mute);font-size:13px}
#info a{display:inline-block;background:#14389a;color:#fff;text-decoration:none;padding:7px 12px;border-radius:6px;font-size:14px}
#load{position:fixed;right:12px;bottom:12px;z-index:2;background:rgba(243,241,234,.94);border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:14px;pointer-events:none}
/* drawer pop-up floats over the dimmed 3D view */
section.open{background:rgba(16,18,24,.6)}section.open .inner{background:var(--paper);margin:20px auto;border-radius:12px}
@media (max-width:600px){section.open .inner{margin:0;border-radius:0;min-height:100%}}
</style>
<link rel="stylesheet" href="drawer.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/","@mkkellogg/gaussian-splats-3d":"https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js"}}</script>
</head><body>
<canvas id="c"></canvas>
<div id="load">Loading the 3D scan…</div>
<div class="bar"><span class="chip"><a href="index.html">← Flat wall view</a></span>
<button class="chip" id="tog">Hide photos</button><button class="chip" id="home">Down the aisle</button><button class="chip" id="vl">Left wall</button><button class="chip" id="vr">Right wall</button>
<span class="chip">Drag to look around, right-drag or two fingers to slide, scroll or pinch to zoom. Tap a drawer or bin shelf.</span></div>
<div id="info"><h2 id="it"></h2><p id="is"></p></div>
<script src="drawer.js"></script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import * as GS from '@mkkellogg/gaussian-splats-3d';
const [L,DR]=await Promise.all([fetch('wall3d.json').then(r=>r.json()),fetch('drawers.json').then(r=>r.json())]);
const byId=Object.fromEntries(DR.map(d=>[d.id,d]));let paused=false;
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();scene.background=new THREE.Color(0x1b1d22);
const camera=new THREE.PerspectiveCamera(55,1,0.02,200);
const V=a=>new THREE.Vector3(...a);
const n=V(L.normal),up=V(L.up),right=V(L.right);
const ctr=a=>a.reduce((s,p)=>s.add(p),new THREE.Vector3()).multiplyScalar(1/a.length);
const ptsOf=w=>L.slots.filter(s=>(s.w||'left')===w).flatMap(s=>s.q.map(V));
const cL=ctr(ptsOf('left')),pR=ptsOf('right'),cR=pR.length?ctr(pR):cL.clone().addScaledVector(n,2);
const mid=cL.clone().add(cR).multiplyScalar(.5);
const span=ptsOf('left').concat(pR).reduce((m,p)=>Math.max(m,Math.abs(p.clone().sub(mid).dot(right))),0);
camera.up.copy(up);
const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.screenSpacePanning=true;
function look(pos,tgt){camera.position.copy(pos);controls.target.copy(tgt);controls.update()}
function home(){look(mid.clone().addScaledVector(right,span+1.2).addScaledVector(up,.55),mid.clone().addScaledVector(right,-1.5).addScaledVector(up,.15))}
function wallView(c,toward){const d=cR.clone().sub(cL).length()*.92;look(c.clone().addScaledVector(toward,d).addScaledVector(up,.1),c)}
const viewer=new GS.DropInViewer({sharedMemoryForWorkers:false,gpuAcceleratedSort:false});
scene.add(viewer);
const scans=L.scans||['aisle.splat'];const ld=document.getElementById('load');
(async()=>{for(let i=0;i<scans.length;i++){
  const part=scans.length>1?' (part '+(i+1)+' of '+scans.length+')':'';
  ld.textContent='Loading the 3D scan'+part+'…';
  try{await viewer.addSplatScene(scans[i],{format:GS.SceneFormat.Splat,showLoadingUI:false,progressiveLoad:i===0,
     onProgress:p=>{if(p>=0)ld.textContent='Loading the 3D scan'+part+'… '+Math.round(p)+'%'}})}
  catch(e){ld.textContent='Could not load the scan: '+e;return}
  while(viewer.viewer&&viewer.viewer.isLoadingOrUnloading&&viewer.viewer.isLoadingOrUnloading())await new Promise(r=>setTimeout(r,200));}
  ld.remove()})();
// drawer photos as quads
const group=new THREE.Group();scene.add(group);const loader=new THREE.TextureLoader();const offOf=w=>n.clone().multiplyScalar(w==='right'?-0.01:0.01);const aniso=renderer.capabilities.getMaxAnisotropy();
for(const s of L.slots){
  const off=offOf(s.w);const [tl,tr,br,bl]=s.q.map(a=>V(a).add(off));
  const parts=s.d.length?s.d:[null];
  parts.forEach((d,k)=>{const f0=k/parts.length,f1=(k+1)/parts.length,lerp=(a,b,t)=>a.clone().lerp(b,t);
    const p=[lerp(tl,tr,f0),lerp(tl,tr,f1),lerp(bl,br,f1),lerp(bl,br,f0)];
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p.flatMap(v=>[v.x,v.y,v.z]),3));
    g.setAttribute('uv',new THREE.Float32BufferAttribute([f0,1,f1,1,f1,0,f0,0],2));g.setIndex([0,2,1,0,3,2]);
    const m=new THREE.MeshBasicMaterial({side:THREE.DoubleSide,transparent:false,depthWrite:true,visible:!!s.f});
    if(s.f){const t=loader.load(s.f);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=aniso;m.map=t}
    const mesh=new THREE.Mesh(g,m);mesh.renderOrder=-1;mesh.userData={d,s};group.add(mesh)})}
// red bin shelving under the drawers: one photo per unit
for(const b of (L.bins||[])){if(!b.f)continue;
  const off=offOf(b.w);const p=b.q.map(a=>V(a).add(off));const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(p.flatMap(v=>[v.x,v.y,v.z]),3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute([0,1,1,1,1,0,0,0],2));g.setIndex([0,2,1,0,3,2]);
  const t=loader.load(b.f);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=aniso;
  const mesh=new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:t,side:THREE.DoubleSide}));mesh.renderOrder=-1;
  mesh.userData={d:b.d[0],s:{w:b.w,c:b.c,r:'bins'}};group.add(mesh)}
document.getElementById('tog').onclick=e=>{group.visible=!group.visible;e.target.textContent=group.visible?'Hide photos':'Show photos'};
document.getElementById('home').onclick=home;
document.getElementById('vl').onclick=()=>wallView(cL,n);document.getElementById('vr').onclick=()=>wallView(cR,n.clone().negate());
const ray=new THREE.Raycaster(),ptr=new THREE.Vector2();let down;
canvas.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>6)return;
  ptr.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(ptr,camera);
  const h=ray.intersectObjects(group.children)[0];const box=document.getElementById('info');box.style.display='none';
  if(!h)return;
  const {d,s}=h.object.userData;
  if(d&&byId[d.id]){paused=true;DrawerView.open(byId[d.id],canvas,()=>{paused=false});return}
  box.style.display='block';document.getElementById('it').textContent=(s.w==='right'?'Right wall, column ':'Left wall, column ')+s.c+(s.r==='bins'?', bins':', row '+s.r);
  document.getElementById('is').textContent='Inside not photographed yet.'});
function size(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',size);size();home();
renderer.setAnimationLoop(()=>{if(paused)return;controls.update();renderer.render(scene,camera)});
</script></body></html>
